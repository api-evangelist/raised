name: Raised
description: >-
  Raised (joinraised.com) is an AI-powered recruiting platform founded in 2022 and
  backed by 500 Global. It delivers vetted candidates to venture-backed startups —
  particularly in AI, deep tech, and Web3 — at a fraction of the cost and time of
  traditional recruitment agencies, using proprietary AI to match candidates to
  roles. The company is headquartered in Wilmington, Delaware, and operates as a
  software-enabled alternative to traditional staffing firms. Raised publishes a
  marketing website only; no public developer API, documentation, or developer
  platform surface was found during enrichment.
